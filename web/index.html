<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Artless Clash Royale</title>
    <!-- PWA: installable from the phone's browser (Add to Home Screen). -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#236480">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Artless Clash">
    <!-- Self-hosted so the desktop app and offline play get the real font. -->
    <link href="fonts/baloo2.css" rel="stylesheet">
    <style>
        html,
        body {
            margin: 0;
            overflow: hidden;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overscroll-behavior: none;
            touch-action: none;
        }

        canvas {
            /* The pixel art is drawn crisp into a 2-3x backing store; the final fit-to-
               window scale stays smooth (bilinear) so nothing shimmers as it moves. */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            /* Scale to fit the screen while preserving the 540x960 portrait aspect. */
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
        }

        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #236480;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 22%;
            box-sizing: border-box;
            z-index: 10;
            transition: opacity 0.4s;
        }

        #loading-overlay .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #debug-log {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(0, 0, 0, 0.7);
            color: lime;
            font-family: monospace;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            pointer-events: none;
            z-index: 20;
        }

        .log-error {
            color: #ff5555;
        }
    </style>
</head>

<body>
    <div id="loading-overlay"><div class="spinner"></div></div>
    <div id="debug-log"></div>
    <canvas id="gameCanvas"></canvas>
    <script type="module" src="src/main.js?v=26.8.1"></script>
    <script>
        // Offline/installed-app support. Harmless in the desktop app (its
        // network-first worker always hits the local server).
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => { /* optional */ });
            });
        }
    </script>
</body>

</html>
